  --primary:#e8336d; --primary-dark:#b81e52; --aqua:#38b6ff; --sun:#ffc533; --green:#1fd655; --purple:#7a35ff;
  --bg:#fff8fb; --card:#ffffff; --text:#1a1420; --muted:#7b6f80; --line:#f1e3ea;
  --ok:#14b85a; --warn:#f0a020; --danger:#e5484d;
  --r:20px; --shadow:0 4px 18px rgba(232,51,109,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Heebo,"Segoe UI",Arial,sans-serif;direction:rtl;text-align:right}
input,select,textarea,button{font:inherit;color:inherit;direction:rtl}
button{cursor:pointer}
.shell{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
header.top{position:relative;overflow:hidden;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 22px;background:#0e0e0e;
  border-bottom-left-radius:26px;border-bottom-right-radius:26px}
header.top::before,header.top::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.9}
header.top::before{width:90px;height:90px;left:-24px;top:-28px;background:var(--aqua)}
header.top::after{width:60px;height:60px;left:70px;bottom:-26px;background:var(--primary)}
.logo-sm{width:56px;height:56px;border-radius:50%;background:#fff var(--logo) center/cover;flex:0 0 auto;box-shadow:0 0 0 3px var(--aqua)}
.brand-wrap{display:flex;align-items:center;gap:10px}
.top-row{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:760px;margin:auto}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:13px;opacity:.9}
.top-actions{display:flex;gap:6px}
.icon-btn{background:var(--purple);border:0;color:#fff;border-radius:12px 4px 12px 4px;padding:8px 10px;font-size:13px;font-weight:700;white-space:nowrap}.icon-btn:nth-child(2){background:var(--green);color:#06210f}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:16px 14px 110px}
.tabs{position:fixed;bottom:0;right:0;left:0;z-index:20;display:flex;justify-content:space-around;background:#fff;
  border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);box-shadow:0 -4px 18px rgba(30,111,217,.08)}
.tab{flex:1;max-width:160px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:500}
.tab span{font-size:20px}
.tab.on{color:var(--primary);background:#ffe6ef;font-weight:700}
@media(min-width:800px){
  .shell{flex-direction:column}
  .tabs{position:static;order:1;justify-content:center;gap:8px;border-top:0;border-bottom:1px solid var(--line);box-shadow:none;padding:8px}
  main{order:2;padding-bottom:40px}
  .tab{flex-direction:row;gap:8px;max-width:none;flex:0 0 auto;padding:8px 18px;font-size:15px}
}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2{margin:4px 0 12px;font-size:20px}
h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:700;background:var(--primary);color:#fff}
.btn.sec{background:#ffe6ef;color:var(--primary)}
.btn.ghost{background:none;color:var(--primary);border:1.5px solid var(--line)}
.btn.danger{background:#fdecec;color:var(--danger)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
input[type=text],input[type=tel],input[type=password],input[type=date],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--aqua);border-color:var(--aqua)}
label.f{display:block;margin:10px 0 4px;font-size:13px;font-weight:700;color:var(--muted)}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:#ffe6ef;color:var(--primary)}
.chip.ok{background:#e3f7ee;color:var(--ok)} .chip.warn{background:#fff3dc;color:#b87400} .chip.bad{background:#fdecec;color:var(--danger)} .chip.grey{background:#eef2f7;color:var(--muted)}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weekbar .lbl{font-weight:800;font-size:17px;text-align:center}
.nav-btn{border:0;background:#fff;box-shadow:var(--shadow);border-radius:50%;width:40px;height:40px;font-size:18px;color:var(--primary);font-weight:800}
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:1 1 0;min-width:74px;border:0;border-radius:14px;background:#fff;box-shadow:var(--shadow);padding:7px 8px;text-align:center;color:var(--muted);font-size:12px}
.pill b{display:block;font-size:17px;color:var(--text)}
.pill .pc{display:block;font-size:12px;white-space:nowrap;line-height:1.55}.pill .ph{display:block;font-size:11px;color:var(--muted);direction:ltr;margin-top:2px}.pill.on .ph{color:#ccc}.pill{padding:10px 8px;border-radius:16px}.pill b{font-size:20px}
.pill.on{background:#0e0e0e;color:#fff} .pill.on b{color:#fff}
.pill.today b::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--sun);margin:2px auto 0}
.shift{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:14px;background:#fff;box-shadow:var(--shadow);margin-bottom:8px;border-right:5px solid var(--aqua);cursor:pointer}
.shift.w{border-right-color:var(--warn)} .shift.b{border-right-color:var(--danger)}
.shift .hrs{font-weight:800;color:var(--primary);min-width:92px;font-size:14px}
.shift .nm{font-weight:700} .shift .rl{font-size:13px;color:var(--muted)}
.warn-line{font-size:12px;color:var(--danger);margin-top:2px} .warn-line.a{color:#b87400}
.seg{display:flex;background:#f8eef2;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:700;color:var(--muted);font-size:14px}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.seg button.on.off{color:var(--danger)} .seg button.on.all{color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.miss{outline:2px solid var(--danger)}
.fab{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:15;border:0;border-radius:999px;background:var(--sun);color:#3a2a00;font-weight:800;padding:14px 20px;box-shadow:0 8px 22px rgba(255,197,51,.55);font-size:15px}
@media(min-width:800px){.fab{bottom:28px}}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.banner{background:#fff3dc;color:#8a5a00;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px}
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(10,30,60,.45)}
.sheet{position:absolute;bottom:0;right:0;left:0;max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-width:560px;margin:auto}
@media(min-width:800px){.sheet{top:50%;bottom:auto;transform:translateY(-50%);border-radius:24px}}
.sheet h2{margin-top:0}
pre.exp,div.exp{white-space:pre-wrap;background:#fff3f7;border-radius:12px;padding:12px;font-family:inherit;font-size:14px;max-height:50vh;overflow:auto;direction:rtl;text-align:right}
#toast{position:fixed;bottom:100px;right:50%;transform:translateX(50%);background:#12263f;color:#fff;padding:10px 18px;border-radius:999px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;font-size:14px;max-width:90vw}
#toast.show{opacity:1}
.center-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:auto;padding:20px}
.logo-ball{width:130px;height:130px;border-radius:50%;margin:0 auto 14px;background:#fff var(--logo) center/cover;box-shadow:0 0 0 5px var(--aqua),0 10px 28px rgba(0,0,0,.18);color:transparent;font-size:0;overflow:hidden}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;background:#f8eef2;border-radius:999px;padding:7px 12px;font-size:14px}
.checks input{width:auto}
.mine{border-right:5px solid var(--sun)}
details summary{cursor:pointer;color:var(--primary);font-size:13px;font-weight:700;margin-top:8px}

/* ---- לוח שיבוץ ---- */
main.wide{max-width:1100px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:4px;background:#cfc6d3}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--danger)}
.board{display:block}
.tray{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:8px;margin-bottom:12px;position:sticky;top:0;z-index:12}
.tray-f{display:flex;gap:6px;margin-bottom:6px}.tray-f select{flex:1;min-width:0;padding:6px 8px;font-size:13px}
.tray-t{font-size:12px;font-weight:800;color:var(--muted);margin:6px 2px 4px}
.tray-l{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:thin}
.pickbar{background:#fff3dc;color:#7a5200;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ec{flex:0 0 auto;min-width:108px;max-width:150px;border-radius:12px;border:2px solid var(--line);background:#fff;padding:5px 9px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ec b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec small{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.ec.st-full{border-color:#9be3bb;background:#f2fbf6}.ec.st-part{border-color:#a9d8ff;background:#f1f9ff}
.ec.st-none{border-style:dashed;border-color:#f3cf86;background:#fffaf0}.ec.st-off{opacity:.55}
.ec.asg{opacity:.7}.ec.asg small.as{color:var(--primary);font-weight:700}
.ec.picked{border-color:var(--primary);box-shadow:0 0 0 3px #ffd0e0}
.lanes{display:grid;grid-template-columns:1fr;gap:10px}
.lane{background:#fff;border-radius:16px;border:2px solid var(--line);padding:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.lane.ok{border-color:var(--ok);background:#f2fbf6}.lane.bad{border-color:var(--danger);background:#fff6f6}
.lane.empty{border-style:dashed}
.lane.target{outline:3px dashed var(--aqua);outline-offset:2px}.lane.no{opacity:.45}
.lane.over{outline:3px solid var(--primary);transform:scale(1.015)}
.lane-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.lane-h b{font-size:16px}
.lane-h .x{margin-inline-start:auto;border:0;background:none;color:var(--muted);font-size:13px;padding:2px 6px}
.tl{position:relative;height:9px;border-radius:5px;background:#f9c9cb;margin:8px 0;overflow:hidden}
.lane.ok .tl{background:#bfe9d0}.lane:not(.ok):not(.bad) .tl{background:#eadfe5}
.tl i{position:absolute;top:0;bottom:0;background:var(--ok)}
.lane-c{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.sc{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.sc.warn{border-color:var(--danger);background:#fff0f0}.sc.w2{border-color:var(--warn)}
.sc em{font-style:normal;color:var(--primary);font-weight:700;font-size:12px}
.sc i{font-style:normal;opacity:.55;padding:0 5px;font-size:14px}
.lane .hint{color:var(--muted);font-size:12px}
.miss{background:#fff6f6;border:1.5px solid #f6c3c5;border-radius:14px;padding:10px;margin-bottom:12px}
.miss.okk{background:#f2fbf6;border-color:#9be3bb}
.miss button{border:0;background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;margin:3px 0 0 4px;box-shadow:var(--shadow);color:var(--danger);font-weight:700}
.ghost-ec{position:fixed;z-index:200;pointer-events:none;background:var(--primary);color:#fff;border-radius:12px;padding:7px 12px;font-weight:700;font-size:14px;box-shadow:0 8px 22px rgba(232,51,109,.45);transform:translate(-50%,-120%)}
.seg2{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}.seg2 button{border:0;background:#fff;padding:6px 12px;font-size:13px;color:var(--muted)}.seg2 button.on{background:#0e0e0e;color:#fff}
@media(min-width:900px){
  .board{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}
  .tray{position:sticky;top:8px;max-height:calc(100vh - 30px);overflow:auto;margin:0}
  .tray-l{flex-direction:column;overflow:visible}.ec{max-width:none}
  .lanes{grid-template-columns:1fr 1fr}
}
</style>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="firebase-config.js"></script>
<script>
const APP_VERSION='6.2';
document.addEventListener('DOMContentLoaded',()=>{const v=document.createElement('div');v.className='ver';v.textContent='v'+APP_VERSION;document.body.appendChild(v)});
"use strict";
/* ================= עזרים ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dowOf=s=>parse(s).getDay();
const weekStart=s=>addDays(s,-dowOf(s));
const todayIso=()=>iso(new Date());
const fmtDay=s=>{const d=parse(s);return 'יום '+DOW[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)};
const fmtDM=s=>{const d=parse(s);return d.getDate()+'/'+(d.getMonth()+1)};
const toMin=t=>{const a=t.split(':').map(Number);return a[0]*60+a[1]};
const fmtT=t=>t==='open'?'פתיחה':t==='close'?'סגירה':t;
const noZero=t=>t.replace(/^0/,'');
const normPhone=p=>String(p||'').replace(/\D/g,'').replace(/^972/,'0');
const samePhone=(a,b)=>{a=normPhone(a);b=normPhone(b);return a.length>=9&&b.length>=9&&a.slice(-9)===b.slice(-9)};
const intlPhone=p=>'972'+normPhone(p).replace(/^0/,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}

/* ================= שכבת נתונים (Firestore או מצב ניסיון) ================= */
const COLS=['employees','roles','days','availability','shifts','weeks','settings'];
const ALL=COLS.concat(['secrets','users']);
const emailOf=(p,v)=>'p'+normPhone(p)+(v>1?'v'+v:'')+'@wp-shifts.example';
const genPin=()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return String(a[0]%1000000).padStart(6,'0')};
const Store={
  mode:'demo',data:{},cbs:[],unsubs:[],cfg:null,
  on(f){this.cbs.push(f)},emit(){this.cbs.forEach(f=>f())},
  reset(){ALL.forEach(c=>this.data[c]={})},
  async init(){
    this.reset();
    const cfg=window.FIREBASE_CONFIG;
    const demo=/[?&]demo\b/.test(location.search);
    if(!demo&&!(cfg&&cfg.apiKey))throw new Error('no-config');
    if(!demo){
      this.cfg=cfg;
      const b='https://www.gstatic.com/firebasejs/9.23.0/';
      await loadScript(b+'firebase-app-compat.js');
      await loadScript(b+'firebase-auth-compat.js');
      await loadScript(b+'firebase-firestore-compat.js');
      firebase.initializeApp(cfg);this.db=firebase.firestore();this.auth=firebase.auth();this.mode='cloud';
      if(cfg.emulator)this.useEmu(this.db,this.auth);
    }else{
      try{const raw=localStorage.getItem('wp_demo');if(raw)Object.assign(this.data,JSON.parse(raw))}catch(e){}
      ALL.forEach(c=>{if(!this.data[c])this.data[c]={}});
    }
  },
  async listen(isMgr,empId){
    this.stop();this.reset();
    const list=COLS.concat(isMgr?['secrets']:[]);
    await Promise.all(list.map(c=>new Promise((res,rej)=>{
      let first=true,q=this.db.collection(c);
      if(c==='availability'&&!isMgr)q=q.where('empId','==',empId);
      this.unsubs.push(q.onSnapshot(s=>{
        const o={};s.forEach(d=>{o[d.id]=Object.assign({},d.data(),{id:d.id})});
        this.data[c]=o;
        if(first){first=false;res()}else this.emit();
      },err=>{console.error(err);if(first){first=false;rej(err)}else if(this.onError)this.onError(err)}));
    })));
  },
  stop(){this.unsubs.forEach(f=>f());this.unsubs=[]},
  save(){try{localStorage.setItem('wp_demo',JSON.stringify(this.data))}catch(e){}},
  newId(c){return this.mode==='cloud'?this.db.collection(c).doc().id:uid()},
  set(c,id,obj){
    obj=Object.assign({},obj,{id});this.data[c][id]=obj;
    if(this.mode==='cloud')this.db.collection(c).doc(id).set(obj).catch(e=>{console.error(e);toast('שגיאת שמירה — '+(e.code==='permission-denied'?'אין הרשאה':'בדוק חיבור'))});
    else this.save();
    this.emit();
  },
  del(c,id){
    delete this.data[c][id];
    if(this.mode==='cloud')this.db.collection(c).doc(id).delete().catch(e=>{console.error(e);toast('שגיאת מחיקה')});
    else this.save();
    this.emit();
  },
  useEmu(db,auth){db.useEmulator('127.0.0.1',8080);auth.useEmulator('http://127.0.0.1:9099',{disableWarnings:true})},
  secApp(){try{return firebase.app('sec')}catch(e){const a=firebase.initializeApp(this.cfg,'sec');if(this.cfg.emulator)a.auth().useEmulator('http://127.0.0.1:9099',{disableWarnings:true});return a}},
  async provision(phone,v){ /* יוצר חשבון כניסה לעובד (אפליקציה משנית כדי לא לנתק את המנהל) */
    const pin=genPin();
    if(this.mode!=='cloud')return {uid:'demo-'+uid(),pin};
    const sec=this.secApp();
    const c=await sec.auth().createUserWithEmailAndPassword(emailOf(phone,v||1),pin);
    await sec.auth().signOut();return {uid:c.user.uid,pin};
  },
  async resetPin(empId){ /* מחזיר קוד חדש */
    const s=D('secrets')[empId],e=emp(empId);
    if(this.mode!=='cloud'){const pin=genPin();this.set('secrets',empId,Object.assign({},s,{pin}));return pin}
    if(s.pin){ /* הקוד ידוע — מחליפים סיסמה בחשבון הקיים */
      const pin=genPin(),sec=this.secApp();
      await sec.auth().signInWithEmailAndPassword(emailOf(s.phone,s.v||1),s.pin);
      await sec.auth().currentUser.updatePassword(pin);await sec.auth().signOut();
      this.set('secrets',empId,Object.assign({},s,{pin,selfSet:false}));return pin;
    }
    /* העובד החליף קוד בעצמו — פותחים חשבון חדש (גרסה הבאה) ומשביתים את הישן */
    const v=(s.v||1)+1,r=await this.provision(s.phone,v);
    if(e.uid)this.set('users',e.uid,{empId,isManager:false,active:false});
    this.set('users',r.uid,{empId,isManager:!!e.isManager,active:e.active!==false});
    this.set('employees',empId,Object.assign({},e,{uid:r.uid}));
    this.set('secrets',empId,{phone:s.phone,pin:r.pin,v,selfSet:false});return r.pin;
  }
};
const D=c=>Store.data[c];
const vals=c=>Object.values(Store.data[c]);
const phoneOf=id=>(D('secrets')[id]||{}).phone||'';
const authMsg=e=>{const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return 'טלפון או קוד שגויים';
  if(c==='auth/too-many-requests')return 'יותר מדי ניסיונות — נסה שוב בעוד כמה דקות';
  if(c==='auth/network-request-failed')return 'אין חיבור לאינטרנט';
  if(c==='auth/email-already-in-use')return 'המספר הזה כבר רשום כמשתמש';
  if(c==='auth/operation-not-allowed')return 'יש להפעיל Email/Password ב-Firebase Authentication';
  return 'שגיאה: '+(c||(e&&e.message)||'לא ידועה')};

/* ================= לוגיקה עסקית ================= */
const DEF_HOURS={0:['09:30','20:00'],1:['09:30','20:00'],2:['09:30','20:00'],3:['09:30','20:00'],4:['09:30','20:00'],5:['09:30','14:00'],6:['18:30','23:00']};
function hoursFor(date){
  const s=D('settings').hours;const w=dowOf(date);
  const m=s&&s.map&&s.map[w];
  const x=m||{open:DEF_HOURS[w][0],close:DEF_HOURS[w][1]};
  const d=D('days')[date];
  if(d)return {open:d.open||x.open,close:d.close||x.close,custom:true,closed:!!d.closed,label:d.label||''};
  return {open:x.open,close:x.close,custom:false,closed:!!(m&&m.closed),label:''};
}
/* אפשרויות שעה — רק בתוך שעות הפעילות של היום */
function fromOptsFor(date){const w=dayWin(date);return ['open'].concat(timeOpts(w[0]+15,w[1]-15))}
function toOptsFor(date){const w=dayWin(date);return timeOpts(w[0]+15,w[1]-15).concat(['close'])}
function normTok(v,date,isEnd){if(v==='open'||v==='close')return v;const h=hoursFor(date);if(!isEnd&&v===h.open)return 'open';if(isEnd&&v===h.close)return 'close';return v}
const resolve=(tok,date)=>tok==='open'?hoursFor(date).open:tok==='close'?hoursFor(date).close:tok;
const emp=id=>D('employees')[id];
const role=id=>D('roles')[id];
const empName=id=>emp(id)?emp(id).name:'(עובד נמחק)';
const roleName=id=>role(id)?role(id).name:'(תפקיד נמחק)';
const sortedRoles=()=>vals('roles').sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name,'he'));
const activeEmps=()=>vals('employees').filter(e=>e.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'he'));
function availDoc(empId,ws){return D('availability')[ws+'_'+empId]}
function availState(empId,date){
  const a=availDoc(empId,weekStart(date));if(!a||!a.days||!a.days[date])return {s:'none'};
  const d=a.days[date];if(d.t==='off')return {s:'off',note:d.note};
  return {s:'on',from:d.t==='all'?'open':d.from,to:d.t==='all'?'close':d.to,note:d.note};
}
function fit(empId,date,from,to){
  const a=availState(empId,date);if(a.s==='none')return 'none';if(a.s==='off')return 'off';
  const f=toMin(resolve(from,date)),t=toMin(resolve(to,date)),af=toMin(resolve(a.from,date)),at=toMin(resolve(a.to,date));
  return af<=f&&at>=t?'ok':'part';
}
function describeAvail(a){
  if(a.s==='none')return 'לא הוזן';if(a.s==='off')return 'לא זמין/ה';
  if(a.from==='open'&&a.to==='close')return 'כל היום';
  return fmtT(a.from)+' – '+fmtT(a.to);
}
const shiftsOn=date=>vals('shifts').filter(s=>s.date===date).sort((a,b)=>
  toMin(resolve(a.from,date))-toMin(resolve(b.from,date))||toMin(resolve(a.to,date))-toMin(resolve(b.to,date))||empName(a.empId).localeCompare(empName(b.empId),'he'));
function warningsOf(s){
  const w=[];const e=emp(s.empId);
  if(!e)return [{lvl:'b',t:'העובד לא קיים'}];
  if(!(e.roles||[]).includes(s.roleId))w.push({lvl:'b',t:'אין הרשאה לתפקיד הזה'});
  const f=fit(s.empId,s.date,s.from,s.to);
  if(f==='off')w.push({lvl:'b',t:'סימן/ה שלא זמין/ה ביום הזה'});
  else if(f==='part')w.push({lvl:'b',t:'מחוץ לשעות הזמינות שהוגשו'});
  else if(f==='none')w.push({lvl:'a',t:'לא הגיש/ה זמינות ליום הזה'});
  const f1=toMin(resolve(s.from,s.date)),t1=toMin(resolve(s.to,s.date));
  if(f1>=t1)w.push({lvl:'b',t:'שעת סיום לפני שעת התחלה'});
  vals('shifts').forEach(o=>{
    if(o.id===s.id||o.date!==s.date||o.empId!==s.empId)return;
    const f2=toMin(resolve(o.from,o.date)),t2=toMin(resolve(o.to,o.date));
    if(f1<t2&&f2<t1)w.push({lvl:'b',t:'חופפת למשמרת אחרת של אותו עובד'});
  });
  return w;
}
function exHours(s){
  const o=noZero(resolve('open',s.date)),f=s.from==='open'?null:noZero(resolve(s.from,s.date)),t=s.to==='close'?null:noZero(resolve(s.to,s.date));
  if(s.to==='close'){return f===null?'פתיחה-סגירה':f+'-סגירה'}
  return (f===null?o:f)+'-'+t;
}
function dayText(date){
  const rows=shiftsOn(date).map(s=>exHours(s)+' *'+empName(s.empId)+'* '+roleName(s.roleId));
  return fmtDay(date)+'\n'+(rows.length?rows.join('\n'):'(אין משמרות)');
}
function weekText(ws){
  const out=[];for(let i=0;i<7;i++){const d=addDays(ws,i);if(shiftsOn(d).length)out.push(dayText(d))}
  return out.join('\n\n');
}
const weekPublished=ws=>!!(D('weeks')[ws]&&D('weeks')[ws].published);
const weekLabel=ws=>fmtDM(ws)+' – '+fmtDM(addDays(ws,6));
const nextWeek=()=>addDays(weekStart(todayIso()),7);

/* ================= מצב האפליקציה ================= */
const S={empQ:'',empRole:'',empStatus:'all',avDay:null,needSetup:false,creds:[],userId:localStorage.getItem('wp_user')||null,view:null,tab:null,
  bWeek:nextWeek(),bDay:null,avWeek:nextWeek(),msWeek:weekStart(todayIso()),
  draft:{},draftKey:'',draftSaved:false,missing:[],fatal:null};
const me=()=>S.userId?emp(S.userId):null;
const TABS={
  manager:[['build','סידור','📅'],['avail','זמינות','🕒'],['emps','עובדים','👥'],['set','הגדרות','⚙️']],
  worker:[['myav','הזמינות שלי','🕒'],['myshifts','המשמרות שלי','📅']]
};
const timeOpts=(from,to,step=15)=>{const a=[];for(let m=from;m<=to;m+=step)a.push(pad(Math.floor(m/60))+':'+pad(m%60));return a};
const FROM_OPTS=['open'].concat(timeOpts(480,1380));
const TO_OPTS=timeOpts(480,1380).concat(['close']);
const HM_OPTS=timeOpts(360,1425);
const optsHtml=(list,sel,lab)=>(sel&&!list.includes(sel)?list.concat([sel]):list).map(v=>'<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(lab?lab(v):v)+'</option>').join('');

/* ================= תצוגות ================= */
function viewSetup(){
  return '<div class="center-screen"><div class="logo-ball">🏊</div><h2 style="text-align:center">ברוכים הבאים ל-White-Pool משמרות</h2>'+
  '<p class="muted" style="text-align:center">הגדרה ראשונית: צור את המנהל/ת הראשון/ה. אחר כך אפשר להוסיף עובדים ומנהלים נוספים.</p>'+
  '<div class="card"><label class="f">שם מלא</label><input type="text" id="su-name" autocomplete="name">'+
  '<label class="f">מספר טלפון</label><input type="tel" id="su-phone" inputmode="tel" placeholder="05X-XXXXXXX" autocomplete="tel">'+(Store.mode==='cloud'?'<label class="f">קוד כניסה אישי (6 ספרות)</label><input type="password" id="su-pin" inputmode="numeric" maxlength="6" autocomplete="new-password">':'')+
  '<p class="muted">נוסיף גם את רשימת התפקידים הרגילה של המשחקייה (קופה, צמידים, מגלשות…) — אפשר לשנות אחר כך.</p>'+
  '<button class="btn block" data-act="setup">התחל</button></div></div>';
}

  return '<div class="center-screen"><div class="logo-ball">🏊</div><h2 style="text-align:center">White-Pool · משמרות</h2>'+

/* ---- עובד: זמינות ---- */
function ensureDraft(){
  const k=S.avWeek+'_'+S.userId;if(S.draftKey===k)return;
  const ex=availDoc(S.userId,S.avWeek);
  S.draft=ex&&ex.days?JSON.parse(JSON.stringify(ex.days)):{};S.draftSaved=!!ex;S.draftKey=k;S.missing=[];
}

/* ================= לוח שיבוץ ================= */
const mmT=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const tokS=(m,date)=>m===toMin(hoursFor(date).open)?'open':mmT(m);
const tokE=(m,date)=>m===toMin(hoursFor(date).close)?'close':mmT(m);
const dayWin=date=>{const h=hoursFor(date);return [toMin(h.open),toMin(h.close)]};
const ivOf=s=>[toMin(resolve(s.from,s.date)),toMin(resolve(s.to,s.date))];
function mergeIv(l){l=l.filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]);const o=[];l.forEach(x=>{const k=o[o.length-1];if(k&&x[0]<=k[1])k[1]=Math.max(k[1],x[1]);else o.push(x.slice())});return o}
function gapsOf(list,win){let cur=win[0];const g=[];mergeIv(list).forEach(x=>{if(x[0]>cur)g.push([cur,Math.min(x[0],win[1])]);cur=Math.max(cur,x[1])});if(cur<win[1])g.push([cur,win[1]]);return g.filter(x=>x[1]>x[0])}
const skipOf=date=>((D('weeks')[weekStart(date)]||{}).skip||{})[date]||[];
function laneInfo(date,roleId,extra){const win=dayWin(date),sh=shiftsOn(date).filter(s=>s.roleId===roleId);return {shifts:sh,gaps:gapsOf(sh.map(ivOf).concat(extra||[]),win),win}}
function reqRoles(date){const sk=skipOf(date);return sortedRoles().filter(r=>!sk.includes(r.id))}
function dayStatus(date){
  if(hoursFor(date).closed)return {cls:'grey',full:0,miss:0};
  let full=0,miss=0;reqRoles(date).forEach(r=>{const g=laneInfo(date,r.id).gaps.length;if(g)miss+=g;else full++});
  return {cls:miss?'bad':full?'ok':'grey',full,miss};
}
const gapTxt=g=>'\u2066'+mmT(g[0])+'–'+mmT(g[1])+'\u2069';
function availWin(empId,date){const a=availState(empId,date),w=dayWin(date);if(a.s!=='on')return null;const f=Math.max(w[0],toMin(resolve(a.from,date))),t=Math.min(w[1],toMin(resolve(a.to,date)));return t>f?[f,t]:null}
function empBusy(empId,date,exceptId){return shiftsOn(date).filter(s=>s.empId===empId&&s.id!==exceptId).map(ivOf)}
function setSkip(date,roleId,on){
  const ws=weekStart(date),w=Object.assign({},D('weeks')[ws]||{}),sk=Object.assign({},w.skip||{});
  let l=(sk[date]||[]).filter(x=>x!==roleId);if(on)l.push(roleId);
  if(l.length)sk[date]=l;else delete sk[date];
  w.skip=sk;Store.set('weeks',ws,w);
}
function trayList(date){
  let l=activeEmps().filter(e=>!e.isManager||(e.roles||[]).length);
  if(S.trayRole)l=l.filter(e=>(e.roles||[]).includes(S.trayRole));
  const f=S.trayF||'avail';
  const st=e=>{const a=availState(e.id,date);if(a.s==='on')return (a.from==='open'&&a.to==='close')?'full':'part';return a.s};
  l=l.map(e=>({e,st:st(e)}));
  if(f==='avail')l=l.filter(x=>x.st==='full'||x.st==='part');
  else if(f==='sub')l=l.filter(x=>x.st!=='off'); /* כולל שלא הגישו */
  const rank={full:0,part:1,none:2,off:3};
  const asg=e=>shiftsOn(date).some(s=>s.empId===e.id);
  return l.sort((a,b)=>(asg(a.e)-asg(b.e))||rank[a.st]-rank[b.st]||a.e.name.localeCompare(b.e.name,'he'));
}

/* הוספת עובד לתפקיד (גרירה / הקשה) */
function dropEmp(empId,roleId){
  const date=S.bDay,e=emp(empId);if(!e||!role(roleId))return;
  const win=dayWin(date),rname=roleName(roleId);
  if(hoursFor(date).closed&&!confirm('המקום סגור ביום הזה. לשבץ בכל זאת?'))return;
  if(!(e.roles||[]).includes(roleId)&&!confirm(e.name+' ללא הרשאה לתפקיד '+rname+'. לשבץ בכל זאת?'))return;
  const a=availState(empId,date);
  if(a.s==='off'&&!confirm(e.name+' סימן/ה שלא זמין/ה ביום הזה. לשבץ בכל זאת?'))return;
  const aw=availWin(empId,date)||win;
  const li=laneInfo(date,roleId),busy=empBusy(empId,date);
  let seg=null;
  const tryIn=ranges=>{for(const g of ranges){const inter=[Math.max(g[0],aw[0]),Math.min(g[1],aw[1])];if(inter[1]<=inter[0])continue;const f=gapsOf(busy,inter);if(f.length){seg=f[0];return true}}return false};
  if(!tryIn(li.gaps)&&!tryIn([aw])){return toast(e.name+' כבר משובץ/ת בכל השעות הזמינות')}
  const id=Store.newId('shifts');
  setSkip(date,roleId,false);
  Store.set('shifts',id,{date,empId,roleId,from:tokS(seg[0],date),to:tokE(seg[1],date)});
  S.pick=null;toast(e.name+' ← '+rname+' '+mmT(seg[0])+'–'+mmT(seg[1])+' · הקש על המשמרת לשינוי שעות');
}
/* פיזור אוטומטי */
function autoFill(dates){
  const created=[],ws=weekStart(dates[0]),wm={};
  vals('shifts').forEach(s=>{if(weekStart(s.date)===ws){const[a,b]=ivOf(s);wm[s.empId]=(wm[s.empId]||0)+b-a}});
  const work=vals('shifts').map(s=>({id:s.id,date:s.date,empId:s.empId,roleId:s.roleId,from:s.from,to:s.to}));
  const pool=activeEmps().filter(e=>(e.roles||[]).length);
  const missing=[];
  dates.forEach(date=>{
    if(hoursFor(date).closed)return;
    const win=dayWin(date),sk=skipOf(date);
    const day=()=>work.filter(s=>s.date===date);
    const av={};pool.forEach(e=>{av[e.id]=availWin(e.id,date)});
    const roles=sortedRoles().filter(r=>!sk.includes(r.id));
    const cnt=r=>pool.filter(e=>av[e.id]&&e.roles.includes(r.id)).length;
    roles.sort((a,b)=>cnt(a)-cnt(b));
    roles.forEach(r=>{
      const virt=[];let guard=0;
      while(guard++<40){
        const have=day().filter(s=>s.roleId===r.id).map(ivOf);
        const gaps=gapsOf(have.concat(virt),win);if(!gaps.length)break;
        const g=gaps[0],glen=g[1]-g[0];let best=null;
        pool.forEach(e=>{
          if(!e.roles.includes(r.id)||!av[e.id])return;
          const inter=[Math.max(g[0],av[e.id][0]),Math.min(g[1],av[e.id][1])];if(inter[1]<=inter[0])return;
          const busy=day().filter(s=>s.empId===e.id).map(ivOf);
          gapsOf(busy,inter).forEach(seg=>{
            const len=seg[1]-seg[0];if(len<Math.min(90,glen))return;
            const sc=(seg[0]===g[0]?1e6:0)+Math.min(len,glen)*100-e.roles.length*8-(wm[e.id]||0)/60;
            if(!best||sc>best.sc)best={sc,e,seg};
          });
        });
        if(!best){virt.push(g);missing.push({date,roleId:r.id,gap:g});continue}
        const o={id:Store.newId('shifts'),date,empId:best.e.id,roleId:r.id,from:tokS(best.seg[0],date),to:tokE(best.seg[1],date)};
        work.push(o);created.push(o);wm[o.empId]=(wm[o.empId]||0)+best.seg[1]-best.seg[0];
      }
    });
  });
  return {created,missing};
}
function autoReport(res,scope){
  const ids=res.created.map(s=>s.id);
  res.created.forEach(o=>Store.set('shifts',o.id,{date:o.date,empId:o.empId,roleId:o.roleId,from:o.from,to:o.to}));
  S.lastAuto=ids;
  if(!res.missing.length)return toast('✨ שובצו '+ids.length+' משמרות — '+scope+' מכוסה במלואו');
  const by={};res.missing.forEach(m=>{(by[m.date]=by[m.date]||[]).push(m)});
  openModal('<h2>✨ הפיזור הושלם</h2><p>נוספו <b>'+ids.length+'</b> משמרות. עדיין חסר כיסוי ב:</p>'+Object.keys(by).sort().map(d=>{const np=by[d].filter(m=>!activeEmps().some(e=>(e.roles||[]).includes(m.roleId))),rest=by[d].filter(m=>!np.includes(m));return '<div style="margin:8px 0"><b>'+fmtDay(d)+'</b>'+(np.length?'<div class="muted" style="padding:4px 0;border-bottom:1px solid var(--line)">אין עובד מורשה לתפקידים: '+esc([...new Set(np.map(m=>roleName(m.roleId)))].join(', '))+'</div>':'')+rest.map(m=>'<div class="row" style="padding:4px 0;border-bottom:1px solid var(--line)"><span class="chip bad">'+esc(roleName(m.roleId))+'</span><span>'+gapTxt(m.gap)+'</span><span class="muted grow">'+esc(whyMissing(m.date,m.roleId,m.gap))+'</span></div>').join('')+'</div>'}).join('')+
    '<p class="muted">אפשר לשבץ ידנית (אפילו עובד שלא סימן זמינות) או להרחיב זמינות/הרשאות.</p><div class="row"><button class="btn grow" data-act="closeModal">הבנתי</button><button class="btn danger" data-act="autoUndo">↩ בטל פיזור</button></div>');
}
function whyMissing(date,roleId,g){
  const perm=activeEmps().filter(e=>(e.roles||[]).includes(roleId));
  if(!perm.length)return 'אין עובד עם הרשאה לתפקיד';
  const av=perm.filter(e=>{const w=availWin(e.id,date);return w&&w[0]<g[1]&&w[1]>g[0]});
  if(!av.length)return 'אף עובד מורשה לא זמין בשעות האלה';
  return 'העובדים הזמינים כבר משובצים בתפקידים אחרים';
}

     '<button class="btn sec sm" data-act="avCopy">העתק מהשבוע הקודם</button></div>';
  for(let i=0;i<7;i++){

      '<button class="all'+(d&&d.t==='all'?' on':'')+'" data-act="avType" data-date="'+date+'" data-t="all">כל היום</button>'+
      '<button class="'+(d&&d.t==='range'?'on':'')+'" data-act="avType" data-date="'+date+'" data-t="range">שעות</button></div>';
    if(d&&d.t==='range'){
      h+='<div class="two" style="margin-top:8px"><div><label class="f">מ-</label><select data-chg="avFrom" data-date="'+date+'">'+optsHtml(fromOptsFor(date),normTok(d.from,date,false),fmtT)+'</select></div>'+

function empMatches(e){
  const q=(S.empQ||'').trim().toLowerCase();
  if(S.empRole&&!(e.roles||[]).includes(S.empRole))return false;
  if(S.empStatus==='active'&&e.active===false)return false;
  if(S.empStatus==='archived'&&e.active!==false)return false;
  if(S.empStatus==='nophone'&&phoneOf(e.id))return false;
  if(S.empStatus==='mgr'&&!e.isManager)return false;
  if(!q)return true;
  const digits=q.replace(/\D/g,''),ph=normPhone(phoneOf(e.id));
  return e.name.toLowerCase().includes(q)||(digits.length>=2&&(ph.includes(digits)||ph.slice(1).includes(digits)))||(e.roles||[]).some(r=>roleName(r).toLowerCase().includes(q));
}
function empListHtml(){
  const all=vals('employees').sort((a,b)=>(a.active===false)-(b.active===false)||a.name.localeCompare(b.name,'he'));

}

function empGroups(roleId,date,from,to){

const SEED_ROLES=['קופה','צמידים','מגלשות','אחמ״שית קומה תחתונה','תיגבור ואיפוס','אבובים','חצי פייפ','קיר טיפוס','סליידר','מסוע','טרמפולינות','אייר בג','אחמ״ש כללי'];
function loginAs(id){S.userId=id;localStorage.setItem('wp_user',id);S.view=null;S.tab=null;S.draftKey='';render()}
const A={
  async setup(){
    const name=$('#su-name').value.trim(),phone=normPhone($('#su-phone').value);
    if(!name||phone.length<9)return toast('נא למלא שם וטלפון תקין');
    const empId=Store.newId('employees');
    if(Store.mode==='cloud'){
      const pin=($('#su-pin').value||'').trim();
      if(!/^\d{6}$/.test(pin))return toast('הקוד חייב להיות 6 ספרות');
      let cred;try{cred=await Store.auth.createUserWithEmailAndPassword(emailOf(phone,1),pin)}catch(e){return toast(authMsg(e))}
      const uid=cred.user.uid,db=Store.db;
      try{
        await db.doc('users/'+uid).set({empId,isManager:true,active:true});
        const b=db.batch();
        b.set(db.doc('employees/'+empId),{id:empId,name,roles:[],isManager:true,active:true,uid});
        b.set(db.doc('secrets/'+empId),{id:empId,phone,pin,v:1});
        SEED_ROLES.forEach((n,i)=>{const r=db.collection('roles').doc();b.set(r,{id:r.id,name:n,order:i})});
        b.set(db.doc('meta/bootstrap'),{at:Date.now()});
        await b.commit();
      }catch(e){
        console.error(e);
        try{await db.doc('users/'+uid).delete()}catch(x){}
        try{await cred.user.delete()}catch(x){}
        return toast('שגיאה בהגדרה ראשונית: '+(e.code||e.message)+' — בדוק שפרסמת את כללי Firestore');
      }
      S.needSetup=false;await startSession(cred.user);
    }else{
      SEED_ROLES.forEach((n,i)=>Store.set('roles',Store.newId('roles'),{name:n,order:i}));
      Store.set('employees',empId,{name,isManager:true,roles:[],active:true,uid:'demo-'+empId});
      Store.set('secrets',empId,{phone,pin:''});
      loginAs(empId);
    }
  },
  async login(){
    const p=$('#lg-phone').value;
    if(Store.mode==='cloud'){
      const pin=($('#lg-pin').value||'').trim();
      if(normPhone(p).length<9||pin.length<6)return toast('נא למלא טלפון וקוד (6 ספרות)');
      let err=null;
      for(let v=1;v<=3;v++){
        try{await Store.auth.signInWithEmailAndPassword(emailOf(p,v),pin);err=null;break}
        catch(e){err=e;if(!/invalid-credential|wrong-password|user-not-found|invalid-email/.test(e.code||''))break}
      }
      if(err)return toast(authMsg(err));
      await startSession(Store.auth.currentUser);
    }else{
      const id=Object.keys(D('secrets')).find(k=>samePhone(D('secrets')[k].phone,p)&&emp(k)&&emp(k).active!==false);
      if(!id)return toast('המספר לא רשום במערכת');loginAs(id);
    }
  },
  async logout(){

    const old=S.draft[d.date]||{};

    S.missing=S.missing.filter(x=>x!==d.date);render();

    const prev=availDoc(S.userId,addDays(S.avWeek,-7));

    const o={};for(let i=0;i<7;i++){const from=addDays(S.avWeek,i-7),to=addDays(S.avWeek,i);if(prev.days&&prev.days[from])o[to]=Object.assign({},prev.days[from])}

  },

    const miss=[];for(let i=0;i<7;i++){const d=addDays(S.avWeek,i);if(hoursFor(d).closed){S.draft[d]={t:'off',from:'open',to:'close',note:'',closed:true};continue}if(!S.draft[d])miss.push(d)}

      if(hoursFor(d).closed)continue;

    Store.set('availability',S.avWeek+'_'+S.userId,{empId:S.userId,weekStart:S.avWeek,days:S.draft,updatedAt:Date.now()});

  autoDay(){

     '<label class="f">קוד נוכחי</label><input type="password" id="pc-old" inputmode="numeric" maxlength="6" autocomplete="current-password">'+
     '<label class="f">קוד חדש (6 ספרות)</label><input type="password" id="pc-new" inputmode="numeric" maxlength="6" autocomplete="new-password">'+
     '<label class="f">אישור קוד חדש</label><input type="password" id="pc-new2" inputmode="numeric" maxlength="6" autocomplete="new-password">'+
     '<div style="height:14px"></div><div class="row"><button class="btn grow" data-act="pinSave">שמור</button><button class="btn ghost" data-act="closeModal">ביטול</button></div>');
  },
  async pinSave(){
    const o=($('#pc-old').value||'').trim(),n=($('#pc-new').value||'').trim(),n2=($('#pc-new2').value||'').trim();
    if(Store.mode!=='cloud')return toast('לא זמין במצב בדיקה');
    if(!/^\d{6}$/.test(n))return toast('הקוד החדש חייב להיות 6 ספרות');
    if(n!==n2)return toast('אישור הקוד לא תואם');
    if(n===o)return toast('הקוד החדש זהה לנוכחי');
    try{
      const u=Store.auth.currentUser;
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,o));
      await u.updatePassword(n);
    }catch(e){return toast(authMsg(e))}
    try{await Store.db.doc('secrets/'+S.userId).update({pin:'',selfSet:true})}catch(e){console.error(e)}
    closeModal();toast('הקוד הוחלף ✓');
  },
  async empSave(){
    const id=$('#em-id').value||Store.newId('employees'),name=$('#em-name').value.trim(),phone=normPhone($('#em-phone').value);
    if(!name||(phone&&phone.length<9))return toast('נא למלא שם וטלפון תקין');
    if(phone&&Object.keys(D('secrets')).some(k=>k!==id&&samePhone(D('secrets')[k].phone,phone)))return toast('המספר כבר קיים אצל עובד אחר');
    const old=emp(id),isManager=$('#em-mgr').checked,activeEl=$('#em-active'),active=activeEl?activeEl.checked:true;
    const others=vals('employees').filter(e=>e.id!==id&&e.isManager&&e.active!==false).length;
    if(!others&&(!isManager||!active))return toast('חייב להישאר לפחות מנהל/ת פעיל/ה אחד/ת');
    const roles=[...document.querySelectorAll('.em-role:checked')].map(x=>x.value);
    let uid=old&&old.uid,newCred=null;
    const phoneChanged=phone&&!samePhone(phoneOf(id),phone);
    if(phone&&(!uid||phoneChanged)){
      try{newCred=await Store.provision(phone)}catch(e){return toast(authMsg(e))}
      if(uid)Store.set('users',uid,{empId:id,isManager:false,active:false}); /* חשבון ישן — מושבת */
      uid=newCred.uid;Store.set('secrets',id,{phone,pin:newCred.pin,v:1});
    }
    Store.set('employees',id,Object.assign({},old,{name,roles,isManager,active,uid:uid||null}));
    if(uid)Store.set('users',uid,{empId:id,isManager,active});
    if(newCred)credsModal([{name,phone,pin:newCred.pin}]);else closeModal();
  },
  empPinSend(d){const s=D('secrets')[d.id];window.open('https://wa.me/'+intlPhone(s.phone)+'?text='+encodeURIComponent(loginMsg({name:empName(d.id),phone:s.phone,pin:s.pin})),'_blank')},
  async empPinReset(d){
    if(!confirm('לאפס את הקוד של '+empName(d.id)+'? הקוד הישן יפסיק לעבוד.'))return;
    try{const pin=await Store.resetPin(d.id);credsModal([{name:empName(d.id),phone:phoneOf(d.id),pin}])}catch(e){toast(authMsg(e))}
  },
  sendPin(d){const c=S.creds[+d.i];window.open('https://wa.me/'+intlPhone(c.phone)+'?text='+encodeURIComponent(loginMsg(c)),'_blank')},
  async copyCreds(){
    const t=S.creds.map(c=>c.name+' | '+c.phone+' | '+c.pin).join('\n');
    try{await navigator.clipboard.writeText(t)}catch(e){}
    toast('הועתק ✓');
  },
  /* תפקידים והגדרות */
  roleAdd(){const n=$('#newRole').value.trim();if(!n)return;if(vals('roles').some(r=>r.name===n))return toast('התפקיד כבר קיים');Store.set('roles',Store.newId('roles'),{name:n,order:vals('roles').length})},
  roleRename(d){const r=role(d.id),n=prompt('שם חדש לתפקיד:',r.name);if(n&&n.trim())Store.set('roles',r.id,Object.assign({},r,{name:n.trim()}))},
  roleDel(d){
    if(vals('shifts').some(s=>s.roleId===d.id))return alert('יש משמרות שמשויכות לתפקיד הזה. אפשר לשנות את שמו במקום למחוק.');
    if(!confirm('למחוק את התפקיד "'+roleName(d.id)+'"?'))return;
    Store.del('roles',d.id);
    vals('employees').forEach(e=>{if((e.roles||[]).includes(d.id))Store.set('employees',e.id,Object.assign({},e,{roles:e.roles.filter(x=>x!==d.id)}))});
  }
};
async function importCsv(text){
  text=text.replace(/^﻿/,'');
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length<2)return toast('הקובץ ריק');
  const byName={};vals('roles').forEach(r=>byName[r.name]=r.id);
  const have=new Set(vals('employees').map(e=>e.name.trim()));
  const creds=[];let added=0,skipped=0,failed=0;
  toast('מייבא… (עשוי לקחת כמה שניות)');
  for(const l of lines.slice(1)){
    const c=l.split(',').map(x=>x.trim().replace(/^"|"$/g,''));
    const name=c[0],phone=normPhone(c[1]||''),rn=(c[2]||'').split(';').map(x=>x.trim()).filter(Boolean);
    if(!name)continue;
    if(have.has(name)||(phone&&Object.keys(D('secrets')).some(k=>samePhone(D('secrets')[k].phone,phone)))){skipped++;continue}
    const roles=rn.map(n=>{if(!byName[n]){const id=Store.newId('roles');Store.set('roles',id,{name:n,order:vals('roles').length});byName[n]=id}return byName[n]});
    const id=Store.newId('employees');let uid=null;
    if(phone){
      try{const r=await Store.provision(phone);uid=r.uid;Store.set('secrets',id,{phone,pin:r.pin,v:1});creds.push({name,phone,pin:r.pin})}
      catch(e){console.error(e);failed++;continue}
    }
    Store.set('employees',id,{name,roles,isManager:false,active:true,uid});
    if(uid)Store.set('users',uid,{empId:id,isManager:false,active:true});
    have.add(name);added++;
  }
  toast('יובאו '+added+' עובדים'+(skipped?' · דולגו '+skipped:'')+(failed?' · נכשלו '+failed:''));
  if(creds.length)credsModal(creds);
}
const C={ /* שינוי ערך בשדה */
  impFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{importCsv(String(r.result));el.value=''};r.readAsText(f,'utf-8')},
  empRole(el){S.empRole=el.value;if(document.activeElement)document.activeElement.blur();render()},empStatus(el){S.empStatus=el.value;if(document.activeElement)document.activeElement.blur();render()},
  avFrom(el){S.draft[el.dataset.date].from=el.value},
  avTo(el){S.draft[el.dataset.date].to=el.value},
  hrsClosed(el){
    const s=D('settings').hours,map=Object.assign({},(s&&s.map)||{});
    for(let w=0;w<7;w++)if(!map[w])map[w]={open:DEF_HOURS[w][0],close:DEF_HOURS[w][1]};
    map[el.dataset.w]=Object.assign({},map[el.dataset.w],{closed:el.checked});
    Store.set('settings','hours',{map});
  },
  hrs(el){
    const s=D('settings').hours,map=Object.assign({},(s&&s.map)||{});
    for(let w=0;w<7;w++)if(!map[w])map[w]={open:DEF_HOURS[w][0],close:DEF_HOURS[w][1]};
    map[el.dataset.w]=Object.assign({},map[el.dataset.w],{[el.dataset.k]:el.value});
    Store.set('settings','hours',{map});
  },
  emAll(el){document.querySelectorAll('.em-role').forEach(c=>c.checked=el.checked)},
  emOne(){const l=[...document.querySelectorAll('.em-role')],a=$('#em-allroles');if(a)a.checked=l.length>0&&l.every(c=>c.checked)},
  sdClosed(el){['sd-open','sd-close'].forEach(i=>{const x=$('#'+i);if(x)x.disabled=el.checked})},
  dhClosed(el){['dh-open','dh-close'].forEach(i=>{const x=$('#'+i);if(x)x.disabled=el.checked})},
  trayF(el){S.trayF=el.value;if(document.activeElement)document.activeElement.blur();render()},trayRole(el){S.trayRole=el.value;if(document.activeElement)document.activeElement.blur();render()},
  smRole(){refreshEmpSelect()},smTime(){refreshEmpSelect()},smFilter(el){S.sm.filter=el.value;refreshEmpSelect('')}
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='closeModal'&&!el.classList.contains('backdrop')&&el.tagName!=='BUTTON')return;
  const f=A[el.dataset.act];if(f)f(el.dataset,el);
});
document.addEventListener('change',ev=>{
  const el=ev.target.closest('[data-chg]');if(!el)return;
  const f=C[el.dataset.chg];if(f)f(el);
});
document.addEventListener('input',ev=>{
  const el=ev.target;if(!el.dataset)return;
  if(el.dataset.inp==='avNote')S.draft[el.dataset.date].note=el.value;
  if(el.dataset.inp==='empQ'){S.empQ=el.value;const l=$('#emp-list');if(l)l.innerHTML=empListHtml()}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&(ev.target.id==='lg-phone'||ev.target.id==='lg-pin'))A.login();
});

/* ================= הצגה ================= */
async function startSession(user){
  const ud=await Store.db.doc('users/'+user.uid).get();
  if(!ud.exists||ud.data().active===false){await Store.auth.signOut();toast('אין הרשאת כניסה לחשבון הזה');return false}
  S.userId=ud.data().empId;S.view=null;S.tab=null;S.draftKey='';
  await Store.listen(!!ud.data().isManager,S.userId);
  render();return true;
}
function render(){
  const app=$('#app');
  if(S.fatal){app.innerHTML='<div class="center-screen"><div class="logo-ball">📡</div><h2 style="text-align:center">אין חיבור לנתונים</h2><p class="muted" style="text-align:center">'+esc(S.fatal)+'</p><button class="btn block" onclick="location.reload()">נסה שוב</button></div>';return}
  const a=document.activeElement;
  if(a&&a.matches&&a.matches('input[type=text],input[type=tel],input[type=password],textarea')&&app.contains(a)&&me())return; /* לא מפריעים להקלדה */
  if(Store.mode==='cloud'){
    if(!S.userId){app.innerHTML=S.needSetup?viewSetup():viewLogin();return}
  }else{
    if(!vals('employees').length){app.innerHTML=viewSetup();return}
    if(S.userId&&(!me()||me().active===false)){S.userId=null;localStorage.removeItem('wp_user')}
    if(!me()){app.innerHTML=viewLogin();return}
  }
  if(!me()){A.logout();return}
  const tr0=$('#tray'),sl=tr0?tr0.scrollLeft:0,st0=tr0?tr0.scrollTop:0,tb0=$('.tray'),tbs=tb0?tb0.scrollTop:0;
  app.innerHTML=viewShell();
  const tr1=$('#tray');if(tr1){tr1.scrollLeft=sl;tr1.scrollTop=st0}const tb1=$('.tray');if(tb1)tb1.scrollTop=tbs;
}

/* ---- גרירה (עכבר + לחיצה ארוכה במגע) ---- */
let DR=null,DR_SUP=0;
function drStart(){
  const e=emp(DR.id);if(!e){DR=null;return}
  DR.on=true;document.body.style.userSelect='none';
  const g=document.createElement('div');g.className='ghost-ec';g.textContent=e.name;document.body.appendChild(g);DR.g=g;drMove(DR.x,DR.y);
  document.querySelectorAll('.lane').forEach(l=>l.classList.add((e.roles||[]).includes(l.dataset.lane)?'target':'no'));
}
function drMove(x,y){if(!DR||!DR.g)return;DR.g.style.left=x+'px';DR.g.style.top=y+'px';
  document.querySelectorAll('.lane.over').forEach(l=>l.classList.remove('over'));
  const t=document.elementFromPoint(x,y),l=t&&t.closest&&t.closest('.lane');if(l)l.classList.add('over')}
function drEnd(drop,x,y){
  if(!DR)return;clearTimeout(DR.timer);
  if(DR.on){
    const t=document.elementFromPoint(x,y),l=t&&t.closest&&t.closest('.lane');
    if(DR.g)DR.g.remove();document.body.style.userSelect='';
    document.querySelectorAll('.lane').forEach(z=>z.classList.remove('over','target','no'));
    DR_SUP=Date.now();
    const id=DR.id;DR=null;
    if(drop&&l)dropEmp(id,l.dataset.lane);else render();
    return;
  }
  DR=null;
}
document.addEventListener('pointerdown',ev=>{
  if(!me()||!me().isManager||ev.button>0)return;
  const c=ev.target.closest&&ev.target.closest('[data-drag]');if(!c)return;
  DR={id:c.dataset.drag,x:ev.clientX,y:ev.clientY,on:false,touch:ev.pointerType==='touch'};
  if(DR.touch)DR.timer=setTimeout(()=>{if(DR&&!DR.on)drStart()},300);
});
document.addEventListener('pointermove',ev=>{
  if(!DR)return;
  if(!DR.on){const d=Math.hypot(ev.clientX-DR.x,ev.clientY-DR.y);
    if(DR.touch){if(d>12){clearTimeout(DR.timer);DR=null}}else if(d>6){DR.x=ev.clientX;DR.y=ev.clientY;drStart()}return}
  drMove(ev.clientX,ev.clientY);
});
document.addEventListener('pointerup',ev=>drEnd(true,ev.clientX,ev.clientY));
document.addEventListener('pointercancel',ev=>{if(DR&&DR.on)drEnd(false,0,0);else DR=null});
document.addEventListener('touchmove',ev=>{if(DR&&DR.on)ev.preventDefault()},{passive:false});
document.addEventListener('contextmenu',ev=>{if(ev.target.closest&&ev.target.closest('[data-drag]'))ev.preventDefault()});
document.addEventListener('click',ev=>{if(Date.now()-DR_SUP<350){ev.stopPropagation();ev.preventDefault()}},true);
(async function boot(){
  try{
    await Store.init();
    if(Store.mode==='cloud'){
      S.userId=null;
      Store.onError=e=>{if(e&&e.code==='permission-denied'){A.logout();toast('אין הרשאה — התחבר מחדש')}};
      S.needSetup=!(await Store.db.doc('meta/bootstrap').get()).exists;
      const user=await new Promise(res=>{const u=Store.auth.onAuthStateChanged(x=>{u();res(x)})});
      if(user)await startSession(user);
    }
  }catch(e){console.error(e);S.fatal=e.message==='no-config'?'חסרה הגדרת Firebase בקובץ firebase-config.js':'לא הצלחנו להתחבר למסד הנתונים. בדוק אינטרנט, שכללי Firestore פורסמו ושהתחברות Email/Password מופעלת.';render();return}
  Store.on(render);render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
