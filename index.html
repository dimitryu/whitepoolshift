  --primary:#e8336d; --primary-dark:#b81e52; --aqua:#38b6ff; --sun:#ffc533; --green:#1fd655; --purple:#7a35ff;
  --bg:#fff8fb; --card:#ffffff; --text:#1a1420; --muted:#7b6f80; --line:#f1e3ea;
  --ok:#14b85a; --warn:#f0a020; --danger:#e5484d;
  --r:20px; --shadow:0 4px 18px rgba(232,51,109,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Heebo,"Segoe UI",Arial,sans-serif;direction:rtl;text-align:right}
input,select,textarea,button{font:inherit;color:inherit;direction:rtl}
button{cursor:pointer}
.shell{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
header.top{position:relative;overflow:hidden;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 22px;background:#0e0e0e;
  border-bottom-left-radius:26px;border-bottom-right-radius:26px}
header.top::before,header.top::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.9}
header.top::before{width:90px;height:90px;left:-24px;top:-28px;background:var(--aqua)}
header.top::after{width:60px;height:60px;left:70px;bottom:-26px;background:var(--primary)}
.logo-sm{width:56px;height:56px;border-radius:50%;background:#fff var(--logo) center/cover;flex:0 0 auto;box-shadow:0 0 0 3px var(--aqua)}
.brand-wrap{display:flex;align-items:center;gap:10px}
.top-row{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:760px;margin:auto}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:13px;opacity:.9}
.top-actions{display:flex;gap:6px}
.icon-btn{background:var(--purple);border:0;color:#fff;border-radius:12px 4px 12px 4px;padding:8px 10px;font-size:13px;font-weight:700;white-space:nowrap}.icon-btn:nth-child(2){background:var(--green);color:#06210f}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:16px 14px 110px}
.tabs{position:fixed;bottom:0;right:0;left:0;z-index:20;display:flex;justify-content:space-around;background:#fff;
  border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);box-shadow:0 -4px 18px rgba(30,111,217,.08)}
.tab{flex:1;max-width:160px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:500}
.tab span{font-size:20px}
.tab.on{color:var(--primary);background:#ffe6ef;font-weight:700}
@media(min-width:800px){
  .shell{flex-direction:column}
  .tabs{position:static;order:1;justify-content:center;gap:8px;border-top:0;border-bottom:1px solid var(--line);box-shadow:none;padding:8px}
  main{order:2;padding-bottom:40px}
  .tab{flex-direction:row;gap:8px;max-width:none;flex:0 0 auto;padding:8px 18px;font-size:15px}
}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2{margin:4px 0 12px;font-size:20px}
h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:700;background:var(--primary);color:#fff}
.btn.sec{background:#ffe6ef;color:var(--primary)}
.btn.ghost{background:none;color:var(--primary);border:1.5px solid var(--line)}
.btn.danger{background:#fdecec;color:var(--danger)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
input[type=text],input[type=tel],input[type=password],input[type=date],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--aqua);border-color:var(--aqua)}
label.f{display:block;margin:10px 0 4px;font-size:13px;font-weight:700;color:var(--muted)}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:#ffe6ef;color:var(--primary)}
.chip.ok{background:#e3f7ee;color:var(--ok)} .chip.warn{background:#fff3dc;color:#b87400} .chip.bad{background:#fdecec;color:var(--danger)} .chip.grey{background:#eef2f7;color:var(--muted)}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weekbar .lbl{font-weight:800;font-size:17px;text-align:center}
.nav-btn{border:0;background:#fff;box-shadow:var(--shadow);border-radius:50%;width:40px;height:40px;font-size:18px;color:var(--primary);font-weight:800}
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;min-width:58px;border:0;border-radius:14px;background:#fff;box-shadow:var(--shadow);padding:7px 8px;text-align:center;color:var(--muted);font-size:12px}
.pill b{display:block;font-size:17px;color:var(--text)}
.pill.on{background:#0e0e0e;color:#fff} .pill.on b{color:#fff}
.pill.today b::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--sun);margin:2px auto 0}
.shift{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:14px;background:#fff;box-shadow:var(--shadow);margin-bottom:8px;border-right:5px solid var(--aqua);cursor:pointer}
.shift.w{border-right-color:var(--warn)} .shift.b{border-right-color:var(--danger)}
.shift .hrs{font-weight:800;color:var(--primary);min-width:92px;font-size:14px}
.shift .nm{font-weight:700} .shift .rl{font-size:13px;color:var(--muted)}
.warn-line{font-size:12px;color:var(--danger);margin-top:2px} .warn-line.a{color:#b87400}
.seg{display:flex;background:#f8eef2;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:700;color:var(--muted);font-size:14px}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.seg button.on.off{color:var(--danger)} .seg button.on.all{color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.miss{outline:2px solid var(--danger)}
.fab{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:15;border:0;border-radius:999px;background:var(--sun);color:#3a2a00;font-weight:800;padding:14px 20px;box-shadow:0 8px 22px rgba(255,197,51,.55);font-size:15px}
@media(min-width:800px){.fab{bottom:28px}}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.banner{background:#fff3dc;color:#8a5a00;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px}
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(10,30,60,.45)}
.sheet{position:absolute;bottom:0;right:0;left:0;max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-width:560px;margin:auto}
@media(min-width:800px){.sheet{top:50%;bottom:auto;transform:translateY(-50%);border-radius:24px}}
.sheet h2{margin-top:0}
pre.exp{white-space:pre-wrap;background:#fff3f7;border-radius:12px;padding:12px;font-family:inherit;font-size:14px;max-height:50vh;overflow:auto;direction:rtl;text-align:right}
#toast{position:fixed;bottom:100px;right:50%;transform:translateX(50%);background:#12263f;color:#fff;padding:10px 18px;border-radius:999px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;font-size:14px;max-width:90vw}
#toast.show{opacity:1}
.center-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:auto;padding:20px}
.logo-ball{width:130px;height:130px;border-radius:50%;margin:0 auto 14px;background:#fff var(--logo) center/cover;box-shadow:0 0 0 5px var(--aqua),0 10px 28px rgba(0,0,0,.18);color:transparent;font-size:0;overflow:hidden}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;background:#f8eef2;border-radius:999px;padding:7px 12px;font-size:14px}
.checks input{width:auto}
.mine{border-right:5px solid var(--sun)}
details summary{cursor:pointer;color:var(--primary);font-size:13px;font-weight:700;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="firebase-config.js"></script>
<script>
const APP_VERSION='5.2';
document.addEventListener('DOMContentLoaded',()=>{const v=document.createElement('div');v.className='ver';v.textContent='v'+APP_VERSION;document.body.appendChild(v)});
"use strict";
/* ================= עזרים ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dowOf=s=>parse(s).getDay();
const weekStart=s=>addDays(s,-dowOf(s));
const todayIso=()=>iso(new Date());
const fmtDay=s=>{const d=parse(s);return 'יום '+DOW[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)};
const fmtDM=s=>{const d=parse(s);return d.getDate()+'/'+(d.getMonth()+1)};
const toMin=t=>{const a=t.split(':').map(Number);return a[0]*60+a[1]};
const fmtT=t=>t==='open'?'פתיחה':t==='close'?'סגירה':t;
const noZero=t=>t.replace(/^0/,'');
const normPhone=p=>String(p||'').replace(/\D/g,'').replace(/^972/,'0');
const samePhone=(a,b)=>{a=normPhone(a);b=normPhone(b);return a.length>=9&&b.length>=9&&a.slice(-9)===b.slice(-9)};
const intlPhone=p=>'972'+normPhone(p).replace(/^0/,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}

/* ================= שכבת נתונים (Firestore או מצב ניסיון) ================= */
const COLS=['employees','roles','days','availability','shifts','weeks','settings'];
const ALL=COLS.concat(['secrets','users']);
const emailOf=(p,v)=>'p'+normPhone(p)+(v>1?'v'+v:'')+'@wp-shifts.example';
const genPin=()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return String(a[0]%1000000).padStart(6,'0')};
const Store={
  mode:'demo',data:{},cbs:[],unsubs:[],cfg:null,
  on(f){this.cbs.push(f)},emit(){this.cbs.forEach(f=>f())},
  reset(){ALL.forEach(c=>this.data[c]={})},
  async init(){
    this.reset();
    const cfg=window.FIREBASE_CONFIG;
    const demo=/[?&]demo\b/.test(location.search);
    if(!demo&&!(cfg&&cfg.apiKey))throw new Error('no-config');
    if(!demo){
      this.cfg=cfg;
      const b='https://www.gstatic.com/firebasejs/9.23.0/';
      await loadScript(b+'firebase-app-compat.js');
      await loadScript(b+'firebase-auth-compat.js');
      await loadScript(b+'firebase-firestore-compat.js');
      firebase.initializeApp(cfg);this.db=firebase.firestore();this.auth=firebase.auth();this.mode='cloud';
      if(cfg.emulator)this.useEmu(this.db,this.auth);
    }else{
      try{const raw=localStorage.getItem('wp_demo');if(raw)Object.assign(this.data,JSON.parse(raw))}catch(e){}
      ALL.forEach(c=>{if(!this.data[c])this.data[c]={}});
    }
  },
  async listen(isMgr,empId){
    this.stop();this.reset();
    const list=COLS.concat(isMgr?['secrets']:[]);
    await Promise.all(list.map(c=>new Promise((res,rej)=>{
      let first=true,q=this.db.collection(c);
      if(c==='availability'&&!isMgr)q=q.where('empId','==',empId);
      this.unsubs.push(q.onSnapshot(s=>{
        const o={};s.forEach(d=>{o[d.id]=Object.assign({},d.data(),{id:d.id})});
        this.data[c]=o;
        if(first){first=false;res()}else this.emit();
      },err=>{console.error(err);if(first){first=false;rej(err)}else if(this.onError)this.onError(err)}));
    })));
  },
  stop(){this.unsubs.forEach(f=>f());this.unsubs=[]},
  save(){try{localStorage.setItem('wp_demo',JSON.stringify(this.data))}catch(e){}},
  newId(c){return this.mode==='cloud'?this.db.collection(c).doc().id:uid()},
  set(c,id,obj){
    obj=Object.assign({},obj,{id});this.data[c][id]=obj;
    if(this.mode==='cloud')this.db.collection(c).doc(id).set(obj).catch(e=>{console.error(e);toast('שגיאת שמירה — '+(e.code==='permission-denied'?'אין הרשאה':'בדוק חיבור'))});
    else this.save();
    this.emit();
  },
  del(c,id){
    delete this.data[c][id];
    if(this.mode==='cloud')this.db.collection(c).doc(id).delete().catch(e=>{console.error(e);toast('שגיאת מחיקה')});
    else this.save();
    this.emit();
  },
  useEmu(db,auth){db.useEmulator('127.0.0.1',8080);auth.useEmulator('http://127.0.0.1:9099',{disableWarnings:true})},
  secApp(){try{return firebase.app('sec')}catch(e){const a=firebase.initializeApp(this.cfg,'sec');if(this.cfg.emulator)a.auth().useEmulator('http://127.0.0.1:9099',{disableWarnings:true});return a}},
  async provision(phone,v){ /* יוצר חשבון כניסה לעובד (אפליקציה משנית כדי לא לנתק את המנהל) */
    const pin=genPin();
    if(this.mode!=='cloud')return {uid:'demo-'+uid(),pin};
    const sec=this.secApp();
    const c=await sec.auth().createUserWithEmailAndPassword(emailOf(phone,v||1),pin);
    await sec.auth().signOut();return {uid:c.user.uid,pin};
  },
  async resetPin(empId){ /* מחזיר קוד חדש */
    const s=D('secrets')[empId],e=emp(empId);
    if(this.mode!=='cloud'){const pin=genPin();this.set('secrets',empId,Object.assign({},s,{pin}));return pin}
    if(s.pin){ /* הקוד ידוע — מחליפים סיסמה בחשבון הקיים */
      const pin=genPin(),sec=this.secApp();
      await sec.auth().signInWithEmailAndPassword(emailOf(s.phone,s.v||1),s.pin);
      await sec.auth().currentUser.updatePassword(pin);await sec.auth().signOut();
      this.set('secrets',empId,Object.assign({},s,{pin,selfSet:false}));return pin;
    }
    /* העובד החליף קוד בעצמו — פותחים חשבון חדש (גרסה הבאה) ומשביתים את הישן */
    const v=(s.v||1)+1,r=await this.provision(s.phone,v);
    if(e.uid)this.set('users',e.uid,{empId,isManager:false,active:false});
    this.set('users',r.uid,{empId,isManager:!!e.isManager,active:e.active!==false});
    this.set('employees',empId,Object.assign({},e,{uid:r.uid}));
    this.set('secrets',empId,{phone:s.phone,pin:r.pin,v,selfSet:false});return r.pin;
  }
};
const D=c=>Store.data[c];
const vals=c=>Object.values(Store.data[c]);
const phoneOf=id=>(D('secrets')[id]||{}).phone||'';
const authMsg=e=>{const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return 'טלפון או קוד שגויים';
  if(c==='auth/too-many-requests')return 'יותר מדי ניסיונות — נסה שוב בעוד כמה דקות';
  if(c==='auth/network-request-failed')return 'אין חיבור לאינטרנט';
  if(c==='auth/email-already-in-use')return 'המספר הזה כבר רשום כמשתמש';
  if(c==='auth/operation-not-allowed')return 'יש להפעיל Email/Password ב-Firebase Authentication';
  return 'שגיאה: '+(c||(e&&e.message)||'לא ידועה')};

/* ================= לוגיקה עסקית ================= */
const DEF_HOURS={0:['09:30','20:00'],1:['09:30','20:00'],2:['09:30','20:00'],3:['09:30','20:00'],4:['09:30','20:00'],5:['09:30','14:00'],6:['18:30','23:00']};
function hoursFor(date){
  const d=D('days')[date];if(d)return {open:d.open,close:d.close,custom:true,closed:false};
  const s=D('settings').hours;const w=dowOf(date);
  const m=s&&s.map&&s.map[w];
  const x=m||{open:DEF_HOURS[w][0],close:DEF_HOURS[w][1]};
  return {open:x.open,close:x.close,custom:false,closed:!!(m&&m.closed)};
}
const resolve=(tok,date)=>tok==='open'?hoursFor(date).open:tok==='close'?hoursFor(date).close:tok;
const emp=id=>D('employees')[id];
const role=id=>D('roles')[id];
const empName=id=>emp(id)?emp(id).name:'(עובד נמחק)';
const roleName=id=>role(id)?role(id).name:'(תפקיד נמחק)';
const sortedRoles=()=>vals('roles').sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name,'he'));
const activeEmps=()=>vals('employees').filter(e=>e.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'he'));
function availDoc(empId,ws){return D('availability')[ws+'_'+empId]}
function availState(empId,date){
  const a=availDoc(empId,weekStart(date));if(!a||!a.days||!a.days[date])return {s:'none'};
  const d=a.days[date];if(d.t==='off')return {s:'off',note:d.note};
  return {s:'on',from:d.t==='all'?'open':d.from,to:d.t==='all'?'close':d.to,note:d.note};
}
function fit(empId,date,from,to){
  const a=availState(empId,date);if(a.s==='none')return 'none';if(a.s==='off')return 'off';
  const f=toMin(resolve(from,date)),t=toMin(resolve(to,date)),af=toMin(resolve(a.from,date)),at=toMin(resolve(a.to,date));
  return af<=f&&at>=t?'ok':'part';
}
function describeAvail(a){
  if(a.s==='none')return 'לא הוזן';if(a.s==='off')return 'לא זמין/ה';
  if(a.from==='open'&&a.to==='close')return 'כל היום';
  return fmtT(a.from)+' – '+fmtT(a.to);
}
const shiftsOn=date=>vals('shifts').filter(s=>s.date===date).sort((a,b)=>
  toMin(resolve(a.from,date))-toMin(resolve(b.from,date))||toMin(resolve(a.to,date))-toMin(resolve(b.to,date))||empName(a.empId).localeCompare(empName(b.empId),'he'));
function warningsOf(s){
  const w=[];const e=emp(s.empId);
  if(!e)return [{lvl:'b',t:'העובד לא קיים'}];
  if(!(e.roles||[]).includes(s.roleId))w.push({lvl:'b',t:'אין הרשאה לתפקיד הזה'});
  const f=fit(s.empId,s.date,s.from,s.to);
  if(f==='off')w.push({lvl:'b',t:'סימן/ה שלא זמין/ה ביום הזה'});
  else if(f==='part')w.push({lvl:'b',t:'מחוץ לשעות הזמינות שהוגשו'});
  else if(f==='none')w.push({lvl:'a',t:'לא הגיש/ה זמינות ליום הזה'});
  const f1=toMin(resolve(s.from,s.date)),t1=toMin(resolve(s.to,s.date));
  if(f1>=t1)w.push({lvl:'b',t:'שעת סיום לפני שעת התחלה'});
  vals('shifts').forEach(o=>{
    if(o.id===s.id||o.date!==s.date||o.empId!==s.empId)return;
    const f2=toMin(resolve(o.from,o.date)),t2=toMin(resolve(o.to,o.date));
    if(f1<t2&&f2<t1)w.push({lvl:'b',t:'חופפת למשמרת אחרת של אותו עובד'});
  });
  return w;
}
function exHours(s){
  const o=noZero(resolve('open',s.date)),f=s.from==='open'?null:noZero(resolve(s.from,s.date)),t=s.to==='close'?null:noZero(resolve(s.to,s.date));
  if(s.to==='close'){return f===null?'פתיחה-סגירה':f+'-סגירה'}
  return (f===null?o:f)+'-'+t;
}
function dayText(date){
  const rows=shiftsOn(date).map(s=>exHours(s)+' *'+empName(s.empId)+'* '+roleName(s.roleId));
  return fmtDay(date)+'\n'+(rows.length?rows.join('\n'):'(אין משמרות)');
}
function weekText(ws){
  const out=[];for(let i=0;i<7;i++){const d=addDays(ws,i);if(shiftsOn(d).length)out.push(dayText(d))}
  return out.join('\n\n');
}
const weekPublished=ws=>!!(D('weeks')[ws]&&D('weeks')[ws].published);
const weekLabel=ws=>fmtDM(ws)+' – '+fmtDM(addDays(ws,6));
const nextWeek=()=>addDays(weekStart(todayIso()),7);

/* ================= מצב האפליקציה ================= */
const S={empQ:'',empRole:'',empStatus:'all',avDay:null,needSetup:false,creds:[],userId:localStorage.getItem('wp_user')||null,view:null,tab:null,
  bWeek:nextWeek(),bDay:null,avWeek:nextWeek(),msWeek:weekStart(todayIso()),
  draft:{},draftKey:'',draftSaved:false,missing:[],fatal:null};
const me=()=>S.userId?emp(S.userId):null;
const TABS={
  manager:[['build','סידור','📅'],['avail','זמינות','🕒'],['emps','עובדים','👥'],['set','הגדרות','⚙️']],
  worker:[['myav','הזמינות שלי','🕒'],['myshifts','המשמרות שלי','📅']]
};
const timeOpts=(from,to,step=15)=>{const a=[];for(let m=from;m<=to;m+=step)a.push(pad(Math.floor(m/60))+':'+pad(m%60));return a};
const FROM_OPTS=['open'].concat(timeOpts(480,1380));
const TO_OPTS=timeOpts(480,1380).concat(['close']);
const HM_OPTS=timeOpts(360,1425);
const optsHtml=(list,sel,lab)=>(sel&&!list.includes(sel)?list.concat([sel]):list).map(v=>'<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(lab?lab(v):v)+'</option>').join('');

/* ================= תצוגות ================= */
function viewSetup(){
  return '<div class="center-screen"><div class="logo-ball">🏊</div><h2 style="text-align:center">ברוכים הבאים ל-White-Pool משמרות</h2>'+
  '<p class="muted" style="text-align:center">הגדרה ראשונית: צור את המנהל/ת הראשון/ה. אחר כך אפשר להוסיף עובדים ומנהלים נוספים.</p>'+
  '<div class="card"><label class="f">שם מלא</label><input type="text" id="su-name" autocomplete="name">'+
  '<label class="f">מספר טלפון</label><input type="tel" id="su-phone" inputmode="tel" placeholder="05X-XXXXXXX" autocomplete="tel">'+(Store.mode==='cloud'?'<label class="f">קוד כניסה אישי (6 ספרות)</label><input type="password" id="su-pin" inputmode="numeric" maxlength="6" autocomplete="new-password">':'')+
  '<p class="muted">נוסיף גם את רשימת התפקידים הרגילה של המשחקייה (קופה, צמידים, מגלשות…) — אפשר לשנות אחר כך.</p>'+
  '<button class="btn block" data-act="setup">התחל</button></div></div>';
}
function viewLogin(){
  return '<div class="center-screen"><div class="logo-ball">🏊</div><h2 style="text-align:center">White-Pool · משמרות</h2>'+
  '<p class="muted" style="text-align:center">כניסה עם הטלפון והקוד האישי שקיבלת מהמנהל</p>'+
  '<div class="card"><label class="f">מספר טלפון</label><input type="tel" id="lg-phone" inputmode="tel" placeholder="05X-XXXXXXX" autocomplete="username">'+(Store.mode==='cloud'?'<label class="f">קוד כניסה (6 ספרות)</label><input type="password" id="lg-pin" inputmode="numeric" maxlength="6" autocomplete="current-password">':'')+
  '<div style="height:12px"></div><button class="btn block" data-act="login">כניסה</button>'+
  '<p class="muted" style="margin-bottom:0">אין לך קוד או שכחת אותו? פנה/י למנהל/ת המשמרות.</p></div>'+
  (Store.mode==='demo'?'<div class="banner">מצב בדיקה מקומי (?demo) — הנתונים נשמרים רק במכשיר הזה.</div>':'')+'</div>';
}
function viewShell(){
  const u=me();
  if(!S.view)S.view=u.isManager?'manager':'worker';
  if(S.view==='manager'&&!u.isManager)S.view='worker';
  const tabs=TABS[S.view];
  if(!S.tab||!tabs.some(t=>t[0]===S.tab))S.tab=tabs[0][0];
  let body='';
  switch(S.tab){case'build':body=viewBuild();break;case'avail':body=viewAvailMgr();break;case'emps':body=viewEmps();break;case'set':body=viewSettings();break;
    case'myav':body=viewMyAvail();break;case'myshifts':body=viewMyShifts();break}
  return '<div class="shell"><header class="top"><div class="top-row"><div class="brand-wrap"><div class="logo-sm"></div><div class="brand">White-Pool<small>שלום '+esc(u.name.split(' ')[0])+'</small></div></div>'+
    '<div class="top-actions">'+(u.isManager?'<button class="icon-btn" data-act="switchView">'+(S.view==='manager'?'👤 כעובד':'🛠 כמנהל')+'</button>':'')+
    '<button class="icon-btn" data-act="pinChange" aria-label="החלפת קוד">🔑</button><button class="icon-btn" data-act="logout">יציאה</button></div></div></header>'+
    '<nav class="tabs">'+tabs.map(t=>'<button class="tab'+(S.tab===t[0]?' on':'')+'" data-act="tab" data-t="'+t[0]+'"><span>'+t[2]+'</span>'+t[1]+'</button>').join('')+'</nav>'+
    '<main>'+(Store.mode==='demo'?'<div class="banner">מצב בדיקה מקומי (?demo) — הנתונים נשמרים רק במכשיר הזה.</div>':'')+body+'</main></div>';
}
function weekBar(key,ws){
  return '<div class="weekbar"><button class="nav-btn" data-act="wk" data-key="'+key+'" data-d="7" aria-label="שבוע הבא">›</button>'+
  '<div class="lbl">שבוע '+weekLabel(ws)+'</div>'+
  '<button class="nav-btn" data-act="wk" data-key="'+key+'" data-d="-7" aria-label="שבוע קודם">‹</button></div>';
}

/* ---- עובד: זמינות ---- */
function ensureDraft(){
  const k=S.avWeek+'_'+S.userId;if(S.draftKey===k)return;
  const ex=availDoc(S.userId,S.avWeek);
  S.draft=ex&&ex.days?JSON.parse(JSON.stringify(ex.days)):{};S.draftSaved=!!ex;S.draftKey=k;S.missing=[];
}
function viewMyAvail(){
  ensureDraft();
  let h='<h2>הזמינות שלי</h2>'+weekBar('avWeek',S.avWeek);
  h+='<div class="row between" style="margin-bottom:10px"><span class="chip '+(S.draftSaved?'ok':'warn')+'">'+(S.draftSaved?'הוגשה ✓':'עדיין לא הוגשה')+'</span>'+
     '<button class="btn sec sm" data-act="avCopy">העתק מהשבוע הקודם</button></div>';
  for(let i=0;i<7;i++){
    const date=addDays(S.avWeek,i),d=S.draft[date],hr=hoursFor(date);
    if(hr.closed){h+='<div class="card" style="opacity:.65"><div class="row between"><h3 style="margin:0">'+fmtDay(date)+'</h3><span class="chip">סגור</span></div><div class="muted" style="margin-top:6px">המקום סגור ביום הזה — אין משמרות.</div></div>';continue}
    h+='<div class="card'+(S.missing.includes(date)?' miss':'')+'"><div class="row between"><h3 style="margin:0">'+fmtDay(date)+'</h3><span class="muted">'+hr.open+'–'+hr.close+'</span></div>'+
    '<div class="seg" style="margin-top:8px">'+
      '<button class="off'+(d&&d.t==='off'?' on':'')+'" data-act="avType" data-date="'+date+'" data-t="off">לא זמין</button>'+
      '<button class="all'+(d&&d.t==='all'?' on':'')+'" data-act="avType" data-date="'+date+'" data-t="all">כל היום</button>'+
      '<button class="'+(d&&d.t==='range'?'on':'')+'" data-act="avType" data-date="'+date+'" data-t="range">שעות</button></div>';
    if(d&&d.t==='range'){
      h+='<div class="two" style="margin-top:8px"><div><label class="f">מ-</label><select data-chg="avFrom" data-date="'+date+'">'+optsHtml(FROM_OPTS,d.from,fmtT)+'</select></div>'+
         '<div><label class="f">עד</label><select data-chg="avTo" data-date="'+date+'">'+optsHtml(TO_OPTS,d.to,fmtT)+'</select></div></div>';
    }
    if(d)h+='<input type="text" style="margin-top:8px" placeholder="הערה (לא חובה)" value="'+esc(d.note||'')+'" data-inp="avNote" data-date="'+date+'">';
    h+='</div>';
  }
  return h+'<button class="btn block" data-act="avSubmit">'+(S.draftSaved?'עדכן זמינות':'שלח זמינות')+'</button>';
}
/* ---- עובד: המשמרות שלי ---- */
function viewMyShifts(){
  let h='<h2>המשמרות שלי</h2>'+weekBar('msWeek',S.msWeek);
  if(!weekPublished(S.msWeek))return h+'<div class="card empty">הסידור לשבוע הזה עדיין לא פורסם.</div>';
  const t=todayIso();let any=false;
  for(let i=0;i<7;i++){
    const date=addDays(S.msWeek,i),all=shiftsOn(date),mine=all.filter(s=>s.empId===S.userId);
    if(mine.length)any=true;
    h+='<div class="card'+(mine.length?' mine':'')+'"><div class="row between"><h3 style="margin:0">'+fmtDay(date)+(date===t?' <span class="chip">היום</span>':'')+'</h3></div>';
    if(mine.length)h+=mine.map(s=>'<div class="row" style="margin-top:8px"><span style="font-weight:800;color:var(--primary)">'+esc(exHours(s))+'</span><span style="font-weight:700">'+esc(roleName(s.roleId))+'</span></div>').join('');
    else h+='<div class="muted" style="margin-top:6px">אין לך משמרת ביום הזה</div>';
    if(all.length)h+='<details><summary>מי עובד ביום הזה ('+all.length+')</summary>'+all.map(s=>'<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted" style="min-width:92px">'+esc(exHours(s))+'</span><span class="grow"><b>'+esc(empName(s.empId))+'</b> · '+esc(roleName(s.roleId))+'</span></div>').join('')+'</details>';
    h+='</div>';
  }
  if(!any)h+='<div class="muted" style="text-align:center">לא שובצת השבוע.</div>';
  return h;
}
/* ---- מנהל: סידור ---- */
function viewBuild(){
  const ws=S.bWeek;
  if(!S.bDay||weekStart(S.bDay)!==ws)S.bDay=(weekStart(todayIso())===ws?todayIso():ws);
  const t=todayIso(),pub=weekPublished(ws),date=S.bDay,hr=hoursFor(date),list=shiftsOn(date);
  let h='<h2>בניית סידור</h2>'+weekBar('bWeek',ws);
  h+='<div class="row between wrap" style="margin-bottom:10px"><span class="chip '+(pub?'ok':'warn')+'">'+(pub?'פורסם — העובדים רואים את הסידור':'טיוטה — העובדים עדיין לא רואים')+'</span>'+
     '<div class="row"><button class="btn sec sm" data-act="exportWeek">שלח כטקסט</button><button class="btn sm '+(pub?'ghost':'ok')+'" data-act="publish">'+(pub?'בטל פרסום':'פרסם באפליקציה')+'</button></div></div><div class="muted" style="margin:-4px 0 10px">פרסום באפליקציה — העובדים רואים את המשמרות שלהם בתוך האפליקציה. שליחה כטקסט — העתקה/וואטסאפ בלבד, לא משנה מה העובדים רואים.</div>';
  h+='<div class="pills">';
  for(let i=0;i<7;i++){const d=addDays(ws,i);h+='<button class="pill'+(d===date?' on':'')+(d===t?' today':'')+'" data-act="day" data-date="'+d+'">'+DOW[i]+'<b>'+parse(d).getDate()+'</b>'+shiftsOn(d).length+' משמרות</button>'}
  h+='</div><div class="card"><div class="row between wrap"><div><h3 style="margin:0">'+fmtDay(date)+'</h3><span class="muted">פתיחה '+hr.open+' · סגירה '+hr.close+(hr.custom?' (מותאם)':'')+'</span>'+(hr.closed?' <span class="chip warn">המקום סגור ביום הזה</span>':'')+'</div>'+
     '<div class="row wrap"><button class="btn ghost sm" data-act="dayHours">שעות היום</button><button class="btn ghost sm" data-act="copyDay">העתק מיום…</button><button class="btn sec sm" data-act="exportDay">שלח יום כטקסט</button></div></div></div>';
  if(!list.length)h+='<div class="card empty">אין משמרות ליום הזה. לחץ על "+ משמרת".</div>';
  list.forEach(s=>{
    const w=warningsOf(s),lvl=w.some(x=>x.lvl==='b')?'b':w.length?'w':'';
    h+='<div class="shift '+lvl+'" data-act="shiftEdit" data-id="'+s.id+'"><div class="hrs">'+esc(exHours(s))+'</div><div class="grow"><div class="nm">'+esc(empName(s.empId))+'</div><div class="rl">'+esc(roleName(s.roleId))+'</div>'+
       w.map(x=>'<div class="warn-line '+(x.lvl==='a'?'a':'')+'">⚠ '+esc(x.t)+'</div>').join('')+'</div></div>';
  });
  return h+'<button class="fab" data-act="shiftNew">+ משמרת</button>';
}
/* ---- מנהל: זמינות ---- */
function availSection(title,cls,items){
  return '<div class="row between" style="margin:14px 2px 8px"><h3 style="margin:0">'+title+'</h3><span class="chip '+cls+'">'+items.length+'</span></div>'+
    (items.length?items.join(''):'<div class="muted" style="margin:0 4px 6px">אין עובדים בקבוצה הזו</div>');
}
function viewAvailMgr(){
  const ws=S.avWeek,emps=activeEmps().filter(e=>!e.isManager||(e.roles||[]).length);
  if(S.avDay&&weekStart(S.avDay)!==ws)S.avDay=null;
  let h='<h2>זמינות עובדים</h2>'+weekBar('avWeek',ws);
  if(!emps.length)return h+'<div class="card empty">עדיין אין עובדים. הוסף בלשונית "עובדים".</div>';
  const days=[0,1,2,3,4,5,6].map(i=>addDays(ws,i));
  h+='<div class="pills"><button class="pill'+(!S.avDay?' on':'')+'" data-act="avDay" data-date="">כל<b>השבוע</b></button>'+
     days.map((d,i)=>{const n=emps.filter(e=>availState(e.id,d).s==='on').length;return '<button class="pill'+(S.avDay===d?' on':'')+'" data-act="avDay" data-date="'+d+'">'+DOW[i]+'<b>'+parse(d).getDate()+'</b>'+n+' זמינים</button>'}).join('')+'</div>';
  const remindBtn=e=>'<button class="btn sec sm" data-act="remind" data-id="'+e.id+'">תזכורת בוואטסאפ</button>';
  const card=(e,sub,right)=>'<div class="card" style="padding:12px"><div class="row between"><div class="grow" data-act="availView" data-id="'+e.id+'" style="cursor:pointer"><b>'+esc(e.name)+'</b><div class="muted">'+sub+'</div></div>'+(right||'')+'</div></div>';
  const submitted=emps.filter(e=>availDoc(e.id,ws)),notSub=emps.filter(e=>!availDoc(e.id,ws));
  if(!S.avDay){
    const cnt=e=>days.filter(d=>availState(e.id,d).s==='on').length;
    const avail=submitted.filter(e=>cnt(e)>0),allOff=submitted.filter(e=>cnt(e)===0);
    h+='<div class="muted">הגישו '+submitted.length+' מתוך '+emps.length+'</div>';
    h+=availSection('לא הגישו זמינות','warn',notSub.map(e=>card(e,'עדיין לא הגיש/ה',remindBtn(e))));
    h+=availSection('הגישו — זמינים','ok',avail.map(e=>card(e,'זמין/ה '+cnt(e)+' מתוך 7 ימים · לחץ לפירוט','<span class="chip ok">✓</span>')));
    if(allOff.length)h+=availSection('הגישו — לא זמינים כל השבוע','grey',allOff.map(e=>card(e,'סימן/ה שלא זמין/ה בשום יום','')));
  }else{
    const d=S.avDay,on=[],off=[],none=[];
    emps.forEach(e=>{const a=availState(e.id,d);(a.s==='on'?on:a.s==='off'?off:none).push([e,a])});
    h+='<div class="muted" style="margin-bottom:4px">'+fmtDay(d)+'</div>';
    h+=availSection('זמינים','ok',on.map(([e,a])=>card(e,esc(describeAvail(a))+(a.note?' · '+esc(a.note):''),'')));
    h+=availSection('סימנו לא זמין','grey',off.map(([e,a])=>card(e,'לא זמין/ה'+(a.note?' · '+esc(a.note):''),'')));
    h+=availSection('לא הגישו','warn',none.map(([e])=>card(e,availDoc(e.id,ws)?'לא סומן ליום הזה':'עדיין לא הגיש/ה זמינות',availDoc(e.id,ws)?'':remindBtn(e))));
  }
  return h;
}
/* ---- מנהל: עובדים ---- */
function empMatches(e){
  const q=(S.empQ||'').trim().toLowerCase();
  if(S.empRole&&!(e.roles||[]).includes(S.empRole))return false;
  if(S.empStatus==='active'&&e.active===false)return false;
  if(S.empStatus==='archived'&&e.active!==false)return false;
  if(S.empStatus==='nophone'&&phoneOf(e.id))return false;
  if(S.empStatus==='mgr'&&!e.isManager)return false;
  if(!q)return true;
  const digits=q.replace(/\D/g,''),ph=normPhone(phoneOf(e.id));
  return e.name.toLowerCase().includes(q)||(digits.length>=2&&(ph.includes(digits)||ph.slice(1).includes(digits)))||(e.roles||[]).some(r=>roleName(r).toLowerCase().includes(q));
}
function empListHtml(){
  const all=vals('employees').sort((a,b)=>(a.active===false)-(b.active===false)||a.name.localeCompare(b.name,'he'));
  const list=all.filter(empMatches);
  let h='<div class="muted" style="margin:0 2px 8px">מוצגים '+list.length+' מתוך '+all.length+'</div>';
  if(!list.length)return h+'<div class="card empty">לא נמצאו עובדים מתאימים.</div>';
  list.forEach(e=>{
    h+='<div class="card" style="'+(e.active===false?'opacity:.55':'')+'"><div class="row between" data-act="empEdit" data-id="'+e.id+'" style="cursor:pointer"><div class="grow"><b>'+esc(e.name)+'</b> '+(e.isManager?'<span class="chip">מנהל/ת</span>':'')+(e.active===false?' <span class="chip grey">בארכיון</span>':'')+
       '<div class="muted">'+(phoneOf(e.id)?esc(phoneOf(e.id)):'<span class="chip bad">חסר טלפון — לא יוכל להיכנס</span>')+'</div><div class="muted">'+((e.roles||[]).map(roleName).join(' · ')||'אין תפקידים מוגדרים')+'</div></div><span class="muted">עריכה ›</span></div></div>';
  });
  return h;
}

function openModal(html){const m=$('#modal');m.innerHTML='<div class="backdrop" data-act="closeModal"></div><div class="sheet">'+html+'</div>';m.classList.add('open')}
function closeModal(){const m=$('#modal');m.classList.remove('open');m.innerHTML=''}
const EMP_GROUPS=[['ok','זמינים'],['part','זמינים חלקית'],['noperm','ללא הרשאה לתפקיד'],['none','לא הגישו זמינות'],['off','סימנו לא זמין']];
function empGroups(roleId,date,from,to){
  const g={ok:[],part:[],noperm:[],none:[],off:[]};
  if(!roleId)return g;
  activeEmps().forEach(e=>{
    if(!(e.roles||[]).includes(roleId)){g.noperm.push(e);return}
    g[fit(e.id,date,from,to)==='ok'?'ok':fit(e.id,date,from,to)].push(e);
  });
  return g;
}

  S.sm={id,date:s.date,filter:'ok'};

  if(s.empId&&s.roleId){const g=empGroups(s.roleId,s.date,s.from,s.to);EMP_GROUPS.forEach(([k])=>{if(g[k].some(e=>e.id===s.empId))S.sm.filter=k})}

  async login(){
    const p=$('#lg-phone').value;

      const pin=($('#lg-pin').value||'').trim();
      if(normPhone(p).length<9||pin.length<6)return toast('נא למלא טלפון וקוד (6 ספרות)');

async function importCsv(text){
  text=text.replace(/^﻿/,'');
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length<2)return toast('הקובץ ריק');
  const byName={};vals('roles').forEach(r=>byName[r.name]=r.id);
  const have=new Set(vals('employees').map(e=>e.name.trim()));
  const creds=[];let added=0,skipped=0,failed=0;
  toast('מייבא… (עשוי לקחת כמה שניות)');
  for(const l of lines.slice(1)){
    const c=l.split(',').map(x=>x.trim().replace(/^"|"$/g,''));
    const name=c[0],phone=normPhone(c[1]||''),rn=(c[2]||'').split(';').map(x=>x.trim()).filter(Boolean);
    if(!name)continue;
    if(have.has(name)||(phone&&Object.keys(D('secrets')).some(k=>samePhone(D('secrets')[k].phone,phone)))){skipped++;continue}
    const roles=rn.map(n=>{if(!byName[n]){const id=Store.newId('roles');Store.set('roles',id,{name:n,order:vals('roles').length});byName[n]=id}return byName[n]});
    const id=Store.newId('employees');let uid=null;
    if(phone){
      try{const r=await Store.provision(phone);uid=r.uid;Store.set('secrets',id,{phone,pin:r.pin,v:1});creds.push({name,phone,pin:r.pin})}
      catch(e){console.error(e);failed++;continue}
    }
    Store.set('employees',id,{name,roles,isManager:false,active:true,uid});
    if(uid)Store.set('users',uid,{empId:id,isManager:false,active:true});
    have.add(name);added++;
  }
  toast('יובאו '+added+' עובדים'+(skipped?' · דולגו '+skipped:'')+(failed?' · נכשלו '+failed:''));
  if(creds.length)credsModal(creds);
}

async function startSession(user){
  const ud=await Store.db.doc('users/'+user.uid).get();
  if(!ud.exists||ud.data().active===false){await Store.auth.signOut();toast('אין הרשאת כניסה לחשבון הזה');return false}
  S.userId=ud.data().empId;S.view=null;S.tab=null;S.draftKey='';
  await Store.listen(!!ud.data().isManager,S.userId);
  render();return true;
}
function render(){
  const app=$('#app');
  if(S.fatal){app.innerHTML='<div class="center-screen"><div class="logo-ball">📡</div><h2 style="text-align:center">אין חיבור לנתונים</h2><p class="muted" style="text-align:center">'+esc(S.fatal)+'</p><button class="btn block" onclick="location.reload()">נסה שוב</button></div>';return}
  const a=document.activeElement;
  if(a&&a.matches&&a.matches('input[type=text],input[type=tel],input[type=password],textarea')&&app.contains(a)&&me())return; /* לא מפריעים להקלדה */
  if(Store.mode==='cloud'){
    if(!S.userId){app.innerHTML=S.needSetup?viewSetup():viewLogin();return}
  }else{
    if(!vals('employees').length){app.innerHTML=viewSetup();return}
    if(S.userId&&(!me()||me().active===false)){S.userId=null;localStorage.removeItem('wp_user')}
    if(!me()){app.innerHTML=viewLogin();return}
  }
  if(!me()){A.logout();return}
  app.innerHTML=viewShell();
}
(async function boot(){

      S.userId=null;
      Store.onError=e=>{if(e&&e.code==='permission-denied'){A.logout();toast('אין הרשאה — התחבר מחדש')}};
      S.needSetup=!(await Store.db.doc('meta/bootstrap').get()).exists;
      const user=await new Promise(res=>{const u=Store.auth.onAuthStateChanged(x=>{u();res(x)})});
      if(user)await startSession(user);
    }
  }catch(e){console.error(e);S.fatal=e.message==='no-config'?'חסרה הגדרת Firebase בקובץ firebase-config.js':'לא הצלחנו להתחבר למסד הנתונים. בדוק אינטרנט, שכללי Firestore פורסמו ושהתחברות Email/Password מופעלת.';render();return}
  Store.on(render);render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
